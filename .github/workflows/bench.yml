name: bench

# Runs the cycle benchmark on a self-hosted runner (label "bench") and publishes
# the report to the workflow run's Job Summary. See .github/runner/README.md for runner
# provisioning and the public-repo security model.

on:
  workflow_dispatch:
  push:
    branches: [main, 'ci-*']
  pull_request_target:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: bench
  cancel-in-progress: false

jobs:
  bench:
    # dispatch/push run unconditionally; a PR runs only when a maintainer has
    # applied the "bench" label AND the PR is from this repo (never a fork), so
    # untrusted fork code can never execute on the self-hosted machine.
    if: >-
      github.event_name != 'pull_request_target' ||
      (contains(github.event.pull_request.labels.*.name, 'bench') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, bench]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
          ref: >-
            ${{ github.event_name == 'pull_request_target'
                && github.event.pull_request.head.sha
                || github.sha }}

      - name: Opam cache
        uses: actions/cache@v6
        with:
          path: ~/.opam
          key: opam-${{ runner.environment }}-${{ runner.os }}-${{ hashFiles('.ocaml-version', 'jasmin-nist.opam') }}-${{ github.run_id }}
          restore-keys: |
            opam-${{ runner.environment }}-${{ runner.os }}-${{ hashFiles('.ocaml-version', 'jasmin-nist.opam') }}-

      - name: Toolchain
        run: |
          opam init --bare --disable-sandboxing -y >/dev/null 2>&1 || true
          opam switch jasmin-bench >/dev/null 2>&1 \
            || opam switch create jasmin-bench "$(cat .ocaml-version)"
          opam update -y                         # advance the easycrypt git pin
          opam install . --deps-only -y          # jasmin + easycrypt
          echo "$(opam var --switch=jasmin-bench bin)" >> "$GITHUB_PATH"
          opam env --switch=jasmin-bench \
            | sed -nE "s/^([A-Za-z_]+)='(.*)'; export.*/\1=\2/p" \
            | grep -v '^PATH=' >> "$GITHUB_ENV"

      - name: Versions
        run: |
          jasminc -version
          cc --version | head -1

      - name: Build
        run: |
          make -C src
          make -C bench libs

      # Correctness gate: fail before benching if any backend diverges from KAT.
      - name: KAT
        run: >-
          make -C bench test
          BACKENDS='jasmin mlkem-native mldsa-native pqcrystals pqcrystals-ref'

      - name: Benchmark + report
        run: make -C bench report

      - name: Publish to job summary
        run: cat bench/bench.md >> "$GITHUB_STEP_SUMMARY"
