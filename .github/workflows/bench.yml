name: bench

# Runs the cycle benchmark on a self-hosted runner (label "bench") and publishes
# the report to the workflow run's Job Summary. See bench/RUNNER.md for runner
# provisioning and the public-repo security model.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request_target:
    types: [labeled, synchronize]

# Least privilege: the job only reads the tree and writes the run summary.
permissions:
  contents: read

# One self-hosted runner: serialize bench runs, and never cancel one in flight
# (a half-run leaves no useful numbers).
concurrency:
  group: bench
  cancel-in-progress: false

# Toolchain provided by the runner (one-time opam switch with jasmin 2026.03.1).
env:
  CI_OPAM_SWITCH: jasmin-bench

jobs:
  bench:
    # dispatch/push run unconditionally; a PR runs only when a maintainer has
    # applied the "bench" label AND the PR is from this repo (never a fork), so
    # untrusted fork code can never execute on the self-hosted machine.
    if: >-
      github.event_name != 'pull_request_target' ||
      (contains(github.event.pull_request.labels.*.name, 'bench') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, bench]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
          # No credentials to persist: later steps only clone public submodules
          # and never push. Avoids the post-job submodule auth cleanup, which
          # trips over the mldsa/submodules/* gitlinks (mapped in mldsa/.gitmodules,
          # which top-level git never reads, not the root .gitmodules).
          persist-credentials: false
          ref: >-
            ${{ github.event_name == 'pull_request_target'
                && github.event.pull_request.head.sha
                || github.sha }}

      # A stale .gitmodules entry (mldsa/submodules/dilithium) makes a blanket
      # submodule update abort, so init exactly the paths the build needs.
      - name: Init submodules
        run: >-
          git submodule update --init
          bench/third_party/mlkem-native
          bench/third_party/mldsa-native
          bench/third_party/kyber
          bench/third_party/dilithium

      # Install jasmin + EasyCrypt from the repo's opam file, so a version bump
      # in the tree takes effect here without rebuilding the runner image.
      # (Build caching is handled separately, not via a persistent opam root.)
      - name: Toolchain
        run: |
          opam init --bare --disable-sandboxing -y >/dev/null 2>&1 || true
          opam switch "$CI_OPAM_SWITCH" >/dev/null 2>&1 \
            || opam switch create "$CI_OPAM_SWITCH" 5.3.0
          opam update -y                         # advance the easycrypt git pin
          opam install . --deps-only -y          # jasmin + easycrypt
          # hand the switch to later steps
          echo "$(opam var --switch="$CI_OPAM_SWITCH" bin)" >> "$GITHUB_PATH"
          opam env --switch="$CI_OPAM_SWITCH" \
            | sed -nE "s/^([A-Za-z_]+)='(.*)'; export.*/\1=\2/p" \
            | grep -v '^PATH=' >> "$GITHUB_ENV"

      - name: Versions
        run: |
          jasminc -version
          cc --version | head -1

      - name: Build
        run: |
          make -C src
          make -C bench libs

      # Correctness gate: fail before benching if any backend diverges from KAT.
      - name: KAT
        run: >-
          make -C bench test
          BACKENDS='jasmin mlkem-native mldsa-native pqcrystals pqcrystals-ref'

      - name: Benchmark + report
        run: make -C bench report

      - name: Publish to job summary
        run: cat bench/bench.md >> "$GITHUB_STEP_SUMMARY"
