name: proofs

# Checks every proof on pushes to main and on every pull request; a new push
# to a PR cancels its run in progress.
#
# SECURITY: the plain pull_request trigger is safe while this repo is
# PRIVATE (only collaborators can open PRs). Before making the repo public,
# adopt bench.yml's model (pull_request_target + same-repo gate) so fork
# code can never run on the self-hosted machines.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: proofs-${{ github.ref }}
  cancel-in-progress: true

# The toolchain (jasmin + EasyCrypt + provers + python) comes from flake.nix,
# itself derived from jasmin-nist.opam via opam-nix; the host's /nix/store
# carries it between jobs, so there is nothing to cache on the GitHub side.
# --impure lets the easycrypt pin-depends follow its branch HEAD (the
# equivalent of `opam update` advancing the pin).
env:
  NIX_CONFIG: 'experimental-features = nix-command flakes'
  ECDEV: nix develop --impure --command

jobs:
  check-ec-proofs:
    runs-on: [self-hosted, linux, proofs]
    timeout-minutes: 240
    steps:
      # A pull request is checked at its head commit, the commit its timing
      # record is for.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: false
          persist-credentials: false

      # Builds (or reuses from the store) the whole toolchain; this is the
      # long step on a cold store or after an easycrypt pin advance.
      - name: Toolchain
        run: $ECDEV true

      - name: Why3 configuration
        run: |
          $ECDEV sh -c 'z3 --version; cvc5 --version | head -1'
          $ECDEV easycrypt why3config

      - name: EasyCrypt configuration
        run: $ECDEV easycrypt config

      # One EasyCrypt job per two CPUs the runner's container is pinned to
      # (CPUSET in its instance env): each smt call runs CVC5 and Z3 side by
      # side, so one job per CPU oversubscribes the provers.
      - name: Jobs
        run: echo "JOBS=$(( ($(nproc) + 1) / 2 ))" >> "$GITHUB_ENV"

      # All scenarios (the Makefile's default target) in one runtest
      # invocation, with a per-file report of the time and of the peak
      # memory (scripts/ecmem), and the memory of the whole run sampled
      # every second (scripts/memwatch.py).
      - name: Check proofs
        run: |
          $ECDEV sh -c '
            python3 scripts/memwatch.py proofs-samples.jsonl & watch=$!
            make -C proofs JOBS=$1 REPORT=timing.yml MEMORY=../proofs-maxrss.jsonl; rc=$?
            kill $watch; wait $watch
            exit $rc' sh "$JOBS"

      # Timing pipeline: runtest report and memory -> timing JSON -> sunburst
      # page, published as a run artifact.
      - name: Timing sunburst
        run: |
          $ECDEV python3 scripts/timing-report-to-json.py --jobs "$JOBS" \
            --memory proofs-maxrss.jsonl --samples proofs-samples.jsonl \
            proofs/timing.yml proofs-timing.json
          $ECDEV python3 scripts/timing-sunburst.py proofs-timing.json proofs-timing.html

      - name: Job summary
        env:
          PUBLISHED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          $ECDEV python3 -I - proofs-timing.json >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json, sys
          m = json.load(open(sys.argv[1]))["meta"]
          print(f"Proof checking: **{m['total_seconds'] / 60:.1f} min** cumulative over "
                f"{m['files']} files ({m.get('machine', {}).get('jobs', '?')} jobs).")
          if m.get("memory"):
              gb = lambda b: f"{b / 1e9:.1f} GB"
              print(f"Memory: peak **{gb(m['memory']['peak_total'])}** for the whole run, "
                    f"largest file {gb(m.get('max_file_maxrss') or 0)}.")
          EOF
          site=https://www.strub.nu/jasmin-nist-timing
          if [ "$PUBLISHED" = true ]; then
            echo "**[Results for this commit]($site/#/results/$GITHUB_SHA)** · **[compare with the previous commit]($site/#/compare/$GITHUB_SHA)** on the results dashboard (updated a minute after this run)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "If this commit is the head of a PR, its page on the **[results dashboard]($site/)** compares it with the merge base (published by publish-pr a minute after this run)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload timing artifact
        uses: actions/upload-artifact@v7
        with:
          name: proofs-timing
          path: |
            proofs/timing.yml
            proofs-timing.json
            proofs-timing.html

  # Add this run's timing JSON to the results repo
  # (https://github.com/strub/jasmin-nist-timing), on pushes to main only.
  # A separate job on a GitHub-hosted runner: it only downloads the artifact,
  # so the deploy key never reaches the self-hosted machine nor shares a job
  # with the proof-checking steps.
  publish:
    needs: check-ec-proofs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: proofs-timing
          path: result
      - uses: ./.github/actions/publish-result
        with:
          file: result/proofs-timing.json
          dest: data/proofs
          deploy-key: ${{ secrets.TIMING_DEPLOY_KEY }}
