name: proofs

# SECURITY: the plain pull_request trigger is safe while this repo is
# PRIVATE (only collaborators can open PRs). Before making the repo public,
# adopt bench.yml's model (pull_request_target + label + same-repo gate) so
# fork code can never run on the self-hosted machine.

on:
  workflow_dispatch:
  push:
    branches: [main, 'ci-*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: proofs-${{ github.ref }}
  cancel-in-progress: true

env:
  Z3_VERSION: 4.13.4
  CVC5_VERSION: 1.3.2

jobs:
  check-ec-proofs:
    runs-on: [self-hosted, linux, x64, selfrice]
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false

      - name: Opam cache
        uses: actions/cache@v6
        with:
          path: ~/.opam
          key: opam-${{ runner.environment }}-${{ runner.os }}-${{ hashFiles('.ocaml-version', 'jasmin-nist.opam') }}-${{ github.run_id }}
          restore-keys: |
            opam-${{ runner.environment }}-${{ runner.os }}-${{ hashFiles('.ocaml-version', 'jasmin-nist.opam') }}-

      - name: Toolchain
        run: |
          opam init --bare --disable-sandboxing -y >/dev/null 2>&1 || true
          opam switch proofs >/dev/null 2>&1 \
            || opam switch create proofs "$(cat .ocaml-version)"
          opam update -y                         # advance the easycrypt git pin
          opam install . --deps-only -y          # jasmin + easycrypt
          echo "$(opam var --switch=proofs bin)" >> "$GITHUB_PATH"
          opam env --switch=proofs \
            | sed -nE "s/^([A-Za-z_]+)='(.*)'; export.*/\1=\2/p" \
            | grep -v '^PATH=' >> "$GITHUB_ENV"

      - name: Prover cache
        uses: actions/cache@v6
        with:
          path: ~/provers
          key: provers-${{ runner.os }}-z3-${{ env.Z3_VERSION }}-cvc5-${{ env.CVC5_VERSION }}

      - name: Provers
        run: |
          mkdir -p "$HOME/provers/bin"
          if [ ! -x "$HOME/provers/bin/z3" ]; then
            curl -fsSL -o z3.zip \
              "https://github.com/Z3Prover/z3/releases/download/z3-$Z3_VERSION/z3-$Z3_VERSION-x64-glibc-2.35.zip"
            unzip -q z3.zip
            cp "z3-$Z3_VERSION-x64-glibc-2.35/bin/z3" "$HOME/provers/bin/"
            rm -rf z3.zip "z3-$Z3_VERSION-x64-glibc-2.35"
          fi
          if [ ! -x "$HOME/provers/bin/cvc5" ]; then
            curl -fsSL -o cvc5.zip \
              "https://github.com/cvc5/cvc5/releases/download/cvc5-$CVC5_VERSION/cvc5-Linux-x86_64-static.zip"
            unzip -q cvc5.zip
            cp cvc5-Linux-x86_64-static/bin/cvc5 "$HOME/provers/bin/"
            rm -rf cvc5.zip cvc5-Linux-x86_64-static
          fi
          echo "$HOME/provers/bin" >> "$GITHUB_PATH"

      - name: Why3 configuration
        run: |
          z3 --version
          cvc5 --version | head -1
          easycrypt why3config

      - name: EasyCrypt configuration
        run: easycrypt config

      - name: Check proofs
        run: make -C proofs JOBS=10
